<!doctype html>
<meta charset="utf-8">
<title>banner</title>
<style>
	/*
	 * Everything is sized in viewport units, so the same file renders the 772x250
	 * banner and the 1544x500 one without a second design that can drift from the
	 * first. Both have the same aspect ratio; only the pixel count differs.
	 */
	* { margin: 0; padding: 0; box-sizing: border-box; }

	html, body {
		width: 100vw;
		height: 100vh;
		overflow: hidden;
	}

	body {
		display: flex;
		align-items: center;
		gap: 4.2vw;
		padding: 0 6.5vw;
		/* Viewport units, not percentages: a percentage height resolved short of
		   the viewport and left the wash stopping in a visible seam 56px from the
		   bottom, on a background that otherwise reached the edge. */
		background: #1d2327;
		background-image:
			radial-gradient( 120% 180% at 88% 50%, rgba( 219, 166, 23, 0.16 ) 0%, rgba( 219, 166, 23, 0 ) 55% );
		font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
		-webkit-font-smoothing: antialiased;
		color: #fff;
	}

	.words { flex: 1 1 auto; }

	h1 {
		font-size: 5.05vw;
		line-height: 1.04;
		font-weight: 700;
		letter-spacing: -0.022em;
	}

	h1 .quiet {
		display: block;
		font-size: 2.06vw;
		font-weight: 600;
		letter-spacing: -0.005em;
		color: #a7aaad;
		margin-top: 0.85vw;
	}

	p {
		margin-top: 2.1vw;
		font-size: 1.72vw;
		line-height: 1.42;
		font-weight: 400;
		color: #c3c4c7;
		max-width: 47vw;
	}

	p b {
		font-weight: 600;
		color: #dba617;
	}

	.mark { flex: 0 0 auto; }
	.mark svg { display: block; width: 21vw; height: auto; }
</style>

<div class="words">
	<h1>
		Coupon Audit
		<span class="quiet">and Analytics for WooCommerce</span>
	</h1>
	<p>Find the coupons <b>quietly costing you money</b> — what is still live, what it really applies to, and what overlaps.</p>
</div>

<div class="mark">
	<!-- A ticket, notched, with the one finding this plugin exists for: a coupon
	     nothing will ever turn off. -->
	<svg viewBox="0 0 240 168" fill="none" xmlns="http://www.w3.org/2000/svg">
		<path d="M18 20h204a8 8 0 0 1 8 8v28a28 28 0 0 0 0 56v28a8 8 0 0 1-8 8H18a8 8 0 0 1-8-8v-28a28 28 0 0 0 0-56V28a8 8 0 0 1 8-8Z"
			fill="#dba617"/>
		<path d="M62 112 118 56" stroke="#1d2327" stroke-width="11" stroke-linecap="round"/>
		<circle cx="66" cy="62" r="12" stroke="#1d2327" stroke-width="11"/>
		<circle cx="114" cy="106" r="12" stroke="#1d2327" stroke-width="11"/>
		<path d="M186 52v42" stroke="#1d2327" stroke-width="12" stroke-linecap="round"/>
		<circle cx="186" cy="118" r="7" fill="#1d2327"/>
	</svg>
</div>
