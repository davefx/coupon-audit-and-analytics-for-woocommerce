name: Deploy to WordPress.org

# Pushing a version tag publishes the plugin. Nothing else does.
#
# That tag is pushed by the release workflow in the premium repository, which is
# where this plugin's source lives — see .github/README.md. Everything in this
# repository except this workflow is generated, so there is nothing here to
# build and nothing here to test: the source was tested before the package was
# built, and the package was verified after it was generated.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

  # For trying it against a tag that already exists. Commits nothing.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Prepare everything but commit nothing'
        type: boolean
        default: true

# write rather than read, for one reason: the last step creates the GitHub
# release for the tag being deployed. Nothing else here writes to the
# repository — the deploy goes to WordPress.org over SVN, and the tree is
# generated upstream and pushed here already built.
permissions:
  contents: write

concurrency:
  # One deploy at a time. Two commits racing into the same trunk is not a thing
  # SVN recovers from gracefully.
  group: wporg-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to the plugin directory
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The tag, the plugin header and the readme's Stable tag must agree, or a
      # release publishes one version's code under another version's number —
      # silently, which is the worst way for that to happen. The generator
      # upstream sets all three from one input, so this checks its work rather
      # than a human's; it costs nothing and the alternative is finding out from
      # a user.
      - name: Check the tag, the header and the readme agree
        run: |
          set -euo pipefail

          slug='coupon-audit-and-analytics-for-woocommerce'
          tag='${{ github.ref_name }}'
          header="$( sed -n 's/^ \* Version: *\([0-9][^ ]*\).*/\1/p' "${slug}.php" | head -1 )"
          stable="$( sed -n 's/^Stable tag: *\([0-9][^ ]*\).*/\1/p' readme.txt | head -1 )"

          echo "tag=${tag}  header=${header}  stable tag=${stable}"

          if [[ "${tag}" != "${header}" || "${tag}" != "${stable}" ]]; then
            echo "::error::Tag ${tag}, header ${header} and Stable tag ${stable} must all match."
            exit 1
          fi

      # No build step. This repository is the built tree: its dependencies are
      # already installed without the development ones and everything that does
      # not ship has already been removed. BUILD_DIR is therefore left at the
      # default, and so is ASSETS_DIR — the action already looks in
      # .wordpress-org, which is where the banner, icon and screenshots live.
      - name: Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event.inputs.dry-run == 'true' }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          VERSION: ${{ github.ref_name }}

      # The tag is what publishes; this is what people read. The two came apart
      # once: the trigger moved from "a release was published" to "a tag was
      # pushed", nothing replaced the release, and this repository sat at
      # "Latest: 0.4.1" for five versions while the code was five ahead.
      #
      # Last, and only on a real run, so a release never announces something
      # WordPress.org was not given. Skipped rather than failed if one already
      # exists: a re-run of a deploy should not be an error.
      #
      # The notes are the readme's own changelog entry for this version, because
      # it is already written for somebody deciding whether to update and there
      # is no second audience wanting different words. The awk is inline because
      # everything in this repository except these workflows is generated —
      # bin/ is not shipped. Its counterpart upstream is bin/changelog-entry.sh.
      - name: Announce the release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          v='${{ github.ref_name }}'

          if gh release view "${v}" >/dev/null 2>&1; then
            echo "::warning::A release for ${v} already exists; leaving it alone."
            exit 0
          fi

          notes="$( awk -v want="= ${v} =" '
            $0 == want         { grabbing = 1; next }
            grabbing && /^= /  { exit }
            grabbing && /^== / { exit }
            grabbing           { print }
          ' readme.txt | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac )"

          if [[ -z "${notes}" ]]; then
            echo "::error::readme.txt has no changelog entry for ${v}."
            exit 1
          fi

          gh release create "${v}" --title "${v}" --notes "${notes}" --latest
